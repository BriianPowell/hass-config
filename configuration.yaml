homeassistant: !include includes/homeassistant.yaml
default_config:
frontend:
  themes: !include_dir_merge_named themes
# HTTP (trusted proxies, X-Forwarded-For) is no longer YAML: Home Assistant migrated it to
# .storage/http and ignores an `http:` block. Manage it under Settings > System > Network.
# Keycloak sign-in; needs the hass-oidc-auth integration from HACS (see includes/auth_oidc.yaml).
auth_oidc: !include includes/auth_oidc.yaml

# Logging and History
recorder: !include includes/recorder.yaml
logbook: !include includes/logbook.yaml

# Inputs
input_boolean: !include includes/input_booleans.yaml

# Hand-written automations live in automations/. The UI editors only save to these root files.
automation manual: !include_dir_merge_list automations
automation ui: !include automations.yaml
scene: !include scenes.yaml
script: !include scripts.yaml
person: !include includes/persons.yaml
zone: !include includes/zones.yaml
group: !include includes/wifi_client_groups.yaml
sensor: !include includes/sensors.yaml
utility_meter: !include includes/utility_meter.yaml
mqtt: !include includes/mqtt.yaml
homekit: !include includes/homekit.yaml
prometheus: !include includes/prometheus.yaml

# Enables Lovelace UI
lovelace:
  resource_mode: yaml
  dashboards:
    huntington-beach:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Huntington Beach
      icon: mdi:view-dashboard
      show_in_sidebar: true
  # Add ons for Lovelace
  resources:
    - url: /local/home-assistant-sun-card.js
      type: module
    - url: /local/weather-card/weather-card.js
      type: module

# logger:
#   default: warning
#   logs:
#     homeassistant.components.homekit: debug
#     homeassistant.components.homekit_controller: debug
#     aiohomekit: debug
#     coap: debug
#     pyhap: debug

template: !include_dir_merge_list includes/templates/
