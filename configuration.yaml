homeassistant: !include includes/homeassistant.yaml
default_config:
frontend:
  themes: !include_dir_merge_named themes
http: !include includes/http.yaml

# Logging and History
recorder: !include includes/recorder.yaml
logbook: !include includes/logbook.yaml

# Inputs
input_boolean: !include includes/input_booleans.yaml

automation: !include_dir_merge_list automations
person: !include includes/persons.yaml
scene: !include includes/scenes.yaml
script: !include includes/scripts.yaml
zone: !include includes/zones.yaml
group: !include includes/wifi_client_groups.yaml
sensor: !include includes/sensors.yaml
utility_meter: !include includes/utility_meter.yaml
mqtt: !include includes/mqtt.yaml
homekit: !include includes/homekit.yaml
prometheus: !include includes/prometheus.yaml

# Enables Lovelace UI
lovelace:
  resource_mode: yaml
  dashboards:
    huntington-beach:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Huntington Beach
      icon: mdi:view-dashboard
      show_in_sidebar: true
  # Add ons for Lovelace
  resources:
    - url: /local/home-assistant-sun-card.js
      type: module
    - url: /local/mini-graph-card-bundle.js
      type: module
    - url: /local/fold-entity-row.js
      type: module
    - url: /local/weather-card/weather-card.js
      type: module

# Enables the API
api:

# Needed for HomeKit integration
network:

# Allows you to issue voice commands from the frontend in enabled browsers
conversation:

# logger:
#   default: warning
#   logs:
#     homeassistant.components.homekit: debug
#     homeassistant.components.homekit_controller: debug
#     aiohomekit: debug
#     coap: debug
#     pyhap: debug

template:
- sensor:
  - default_entity_id: sensor.udm_uptime_formatted
    name: UniFi Dream Machine Uptime Formatted
    state: >-
      {% set uptime_entity = 'sensor.boog_dmp_uptime' if states('sensor.boog_dmp_uptime') not in ['unknown', 'unavailable'] else 'sensor.unifi_dream_machine_uptime' %}
      {% set time = states(uptime_entity) | int(0) %}
      {% set minutes = ((time % 3600) / 60) | int %}
      {% set hours = ((time % 86400) / 3600) | int %}
      {% set days = (time / 86400) | int %}
      {%- if time < 60 -%}
        Less than a minute
      {%- else -%}
        {%- if days > 0 -%}{{ days }}d{%- endif -%}
        {%- if hours > 0 -%}{% if days > 0 %} {% endif %}{{ hours }}h{%- endif -%}
        {%- if minutes > 0 -%}{% if days > 0 or hours > 0 %} {% endif %}{{ minutes }}m{%- endif -%}
      {%- endif -%}
  - !include includes/template_dmp_wan.yaml
  # WiFi client groups (includes/wifi_client_groups.yaml) — overview + uncategorized bucket.
  - default_entity_id: sensor.wifi_clients_overview
    name: WiFi Clients Overview
    icon: mdi:wifi
    state: >-
      {% set members =
        expand('group.wifi_people') | list +
        expand('group.wifi_computers') | list +
        expand('group.wifi_media') | list +
        expand('group.wifi_iot') | list +
        expand('group.wifi_guest') | list
      %}
      {% set online = members | selectattr('state', 'eq', 'home') | list | count %}
      {{ online }} online · {{ members | count }} tracked
    attributes:
      people: >-
        {% set m = expand('group.wifi_people') | list %}
        {{ m | selectattr('state', 'eq', 'home') | list | count }}/{{ m | count }} online
      computers: >-
        {% set m = expand('group.wifi_computers') | list %}
        {{ m | selectattr('state', 'eq', 'home') | list | count }}/{{ m | count }} online
      media: >-
        {% set m = expand('group.wifi_media') | list %}
        {{ m | selectattr('state', 'eq', 'home') | list | count }}/{{ m | count }} online
      iot: >-
        {% set m = expand('group.wifi_iot') | list %}
        {{ m | selectattr('state', 'eq', 'home') | list | count }}/{{ m | count }} online
      guest: >-
        {% set m = expand('group.wifi_guest') | list %}
        {{ m | selectattr('state', 'eq', 'home') | list | count }}/{{ m | count }} online
  - default_entity_id: sensor.wifi_uncategorized_online
    name: WiFi Uncategorized Online
    icon: mdi:help-circle-outline
    state: >-
      {% set tracked_ids =
        expand('group.wifi_people') | map(attribute='entity_id') | list +
        expand('group.wifi_computers') | map(attribute='entity_id') | list +
        expand('group.wifi_media') | map(attribute='entity_id') | list +
        expand('group.wifi_iot') | map(attribute='entity_id') | list +
        expand('group.wifi_guest') | map(attribute='entity_id') | list
      %}
      {% set loose = states.device_tracker
        | selectattr('attributes.source_type', 'eq', 'router')
        | rejectattr('entity_id', 'in', tracked_ids)
        | selectattr('state', 'eq', 'home')
        | list
      %}
      {{ loose | count }}
    attributes:
      devices: >-
        {% set tracked_ids =
          expand('group.wifi_people') | map(attribute='entity_id') | list +
          expand('group.wifi_computers') | map(attribute='entity_id') | list +
          expand('group.wifi_media') | map(attribute='entity_id') | list +
          expand('group.wifi_iot') | map(attribute='entity_id') | list +
          expand('group.wifi_guest') | map(attribute='entity_id') | list
        %}
        {% set loose = states.device_tracker
          | selectattr('attributes.source_type', 'eq', 'router')
          | rejectattr('entity_id', 'in', tracked_ids)
          | selectattr('state', 'eq', 'home')
          | map(attribute='name')
          | list
        %}
        {{ loose | join(', ') if loose | count > 0 else 'None' }}
      entity_ids: >-
        {% set tracked_ids =
          expand('group.wifi_people') | map(attribute='entity_id') | list +
          expand('group.wifi_computers') | map(attribute='entity_id') | list +
          expand('group.wifi_media') | map(attribute='entity_id') | list +
          expand('group.wifi_iot') | map(attribute='entity_id') | list +
          expand('group.wifi_guest') | map(attribute='entity_id') | list
        %}
        {{ states.device_tracker
          | selectattr('attributes.source_type', 'eq', 'router')
          | rejectattr('entity_id', 'in', tracked_ids)
          | selectattr('state', 'eq', 'home')
          | map(attribute='entity_id')
          | list
        }}
