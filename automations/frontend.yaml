# name_dark makes each browser follow its own light/dark setting (OS or profile), so no
# sunrise/sunset switching is needed. set_theme is not persisted, hence the start trigger.
- id: frontend_set_theme
  alias: 'Frontend: set theme'
  triggers:
    - trigger: homeassistant
      event: start
  actions:
    - action: frontend.set_theme
      data:
        name: ios-light-mode-blue-red
        name_dark: Dracula
