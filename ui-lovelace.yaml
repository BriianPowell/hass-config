# UI Lovelace
# https://www.home-assistant.io/dashboards/sections/

title: Huntington Beach

views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Today
            icon: mdi:weather-partly-cloudy
          - type: custom:sun-card
          - type: weather-forecast
            entity: weather.forecast_home
            show_current: true
            show_forecast: false
          - type: glance
            title: On Air
            show_name: true
            show_state: true
            show_icon: true
            columns: 2
            state_color: true
            entities:
              - entity: binary_sensor.brian_on_air
                name: Brian
                icon: mdi:broadcast
              - entity: binary_sensor.lauren_on_air
                name: Lauren
                icon: mdi:broadcast
      - type: grid
        cards:
          - type: heading
            heading: Power now
            icon: mdi:flash
          - type: glance
            show_name: true
            show_state: true
            show_icon: true
            columns: 4
            entities:
              - entity: sensor.smartplug_server_1min
                name: Server
                icon: mdi:server
              - entity: sensor.smartplug_pc_1min
                name: PC
                icon: mdi:desktop-tower
              - entity: sensor.smartplug_carlos_1min
                name: Carlos
                icon: mdi:bed
              - entity: sensor.smartplug_lauren_1min
                name: Lauren
                icon: mdi:bed
          - type: entities
            title: Smart plugs
            show_header_toggle: false
            entities:
              - entity: switch.smartplug_server
                name: Server
                tap_action:
                  action: toggle
                  confirmation:
                    text: Are you sure you want to toggle the server plug?
              - entity: switch.smartplug_pc
                name: PC
              - entity: switch.smartplug_carlos
                name: Carlos
              - entity: switch.smartplug_lauren
                name: Lauren
          - type: heading
            heading: Last 7 days
            icon: mdi:chart-line
          # Long-term statistics (hourly, kept indefinitely); the recorder only keeps 5 days of raw history.
          - type: grid
            columns: 2
            square: false
            cards:
              - type: statistics-graph
                title: Server
                entities:
                  - entity: sensor.server_smartplug_power_30min
                    name: Server
                stat_types: [mean, max]
                period: hour
                days_to_show: 7
                chart_type: line
              - type: statistics-graph
                title: PC
                entities:
                  - entity: sensor.pc_smartplug_power_30min
                    name: PC
                stat_types: [mean, max]
                period: hour
                days_to_show: 7
                chart_type: line
              - type: statistics-graph
                title: Carlos
                entities:
                  - entity: sensor.carlos_smartplug_power_30min
                    name: Carlos
                stat_types: [mean, max]
                period: hour
                days_to_show: 7
                chart_type: line
              - type: statistics-graph
                title: Lauren
                entities:
                  - entity: sensor.lauren_smartplug_power_30min
                    name: Lauren
                stat_types: [mean, max]
                period: hour
                days_to_show: 7
                chart_type: line

      - type: grid
        cards:
          - type: heading
            heading: This month
            icon: mdi:calendar-month
          - type: entities
            show_header_toggle: false
            entities:
              - name: Server
                entity: sensor.smartplug_server_1mon
              - name: PC
                entity: sensor.smartplug_pc_1mon
              - name: Carlos
                entity: sensor.smartplug_carlos_1mon
              - name: Lauren
                entity: sensor.smartplug_lauren_1mon


  - title: WiFi
    path: wifi
    icon: mdi:wifi
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections: !include lovelace/wifi_view_sections.yaml

  - title: Network
    path: network
    icon: mdi:router-network
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Gateway
            icon: mdi:router-wireless
          - type: entities
            show_header_toggle: false
            state_color: true
            entities:
              - name: WAN status
                entity: binary_sensor.dmp_wan_online
              - entity: sensor.dmp_wan_latency_ms
                name: WAN latency
                icon: mdi:speedometer
              - entity: sensor.dmp_wan_public_ip
                name: WAN IP
                icon: mdi:ip-network
              - type: divider
              - entity: sensor.boog_dmp_cpu_utilization_2
                name: CPU
                icon: mdi:cpu-64-bit
              - entity: sensor.boog_dmp_memory_utilization_2
                name: Memory
                icon: mdi:memory
              - entity: sensor.udm_uptime_formatted
                name: Uptime
                icon: mdi:clock-outline
              - entity: sensor.boog_dmp_clients
                name: Clients on the gateway
                icon: mdi:lan-connect

      - type: grid
        cards:
          - type: heading
            heading: WAN usage this month
            icon: mdi:wan
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.dmp_wan_monthly_total_mbps
                name: Avg total (down + up)
                icon: mdi:wan
              - type: section
                label: Avg rate
              - entity: sensor.dmp_wan_monthly_download_mbps
                name: Avg download
              - entity: sensor.dmp_wan_monthly_upload_mbps
                name: Avg upload
              - type: section
                label: Volume
              - type: attribute
                entity: sensor.dmp_wan_monthly_total_mbps
                attribute: total_gib
                name: Total transferred (GiB)
              - type: attribute
                entity: sensor.dmp_wan_monthly_total_mbps
                attribute: last_reset
                name: Period started

      - type: grid
        cards:
          - type: heading
            heading: Traffic, last 24 hours
            icon: mdi:chart-line
          - type: history-graph
            title: Throughput (Mbit/s)
            hours_to_show: 24
            entities:
              - entity: sensor.dmp_wan_download_mbps
                name: Received
              - entity: sensor.dmp_wan_upload_mbps
                name: Sent
          - type: history-graph
            title: Packets/s
            hours_to_show: 24
            entities:
              - entity: sensor.dmp_wan_packets_received_rate
                name: Received
              - entity: sensor.dmp_wan_packets_sent_rate
                name: Sent
