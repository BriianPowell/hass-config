# UI Lovelace

background: var(--lovelace-background, var(--primary-background-color))

title: Huntington Beach

views:
  - title: Home
    id: home
    icon: mdi:home
    cards:
      - type: horizontal-stack
        cards:
          - type: custom:sun-card
          - type: custom:weather-card
            entity: weather.forecast_home
            current: true
            details: true
            forecast: false
            hourly_forecast: false

      - type: glance
        title: On Air
        show_name: true
        show_state: true
        show_icon: true
        columns: 2
        state_color: true
        entities:
          - entity: sensor.brian_on_air
            name: Brian
            icon: mdi:broadcast
          - entity: sensor.lauren_on_air
            name: Lauren
            icon: mdi:broadcast

      - type: glance
        title: Live Power
        show_name: true
        show_state: true
        show_icon: true
        columns: 4
        entities:
          - entity: sensor.smartplug_server_1min
            name: Server
            icon: mdi:server
          - entity: sensor.smartplug_pc_1min
            name: PC
            icon: mdi:desktop-tower
          - entity: sensor.smartplug_carlos_1min
            name: Carlos
            icon: mdi:bed
          - entity: sensor.smartplug_lauren_1min
            name: Lauren
            icon: mdi:bed

      - type: grid
        columns: 2
        square: false
        cards:
          - type: entities
            title: Smart Plugs
            show_header_toggle: false
            entities:
              - entity: switch.smartplug_server
                name: Server
                tap_action:
                  action: toggle
                  confirmation:
                    text: Are you sure you want to toggle the server plug?
              - entity: switch.smartplug_pc
                name: PC
              - entity: switch.smartplug_carlos
                name: Carlos
              - entity: switch.smartplug_lauren
                name: Lauren
          - type: entities
            title: Monthly Usage
            show_header_toggle: false
            entities:
              - name: Server
                entity: sensor.smartplug_server_1mon
              - name: PC
                entity: sensor.smartplug_pc_1mon
              - name: Carlos
                entity: sensor.smartplug_carlos_1mon
              - name: Lauren
                entity: sensor.smartplug_lauren_1mon

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mini-graph-card
            name: Server
            icon: mdi:server
            hours_to_show: 168
            points_per_hour: 4
            line_width: 2
            height: 110
            lower_bound: 0
            decimals: 0
            color_thresholds_transition: smooth
            show:
              extrema: true
              average: true
              state: false
              labels: false
              legend: false
            entities:
              - entity: sensor.smartplug_server_1min
                name: Server
                color: "#64b5f6"
                aggregate_func: avg
                show_points: false
          - type: custom:mini-graph-card
            name: PC
            icon: mdi:desktop-tower
            hours_to_show: 168
            points_per_hour: 4
            line_width: 2
            height: 110
            lower_bound: 0
            decimals: 0
            color_thresholds_transition: smooth
            show:
              extrema: true
              average: true
              state: false
              labels: false
              legend: false
            entities:
              - entity: sensor.smartplug_pc_1min
                name: PC
                color: "#ffb74d"
                aggregate_func: avg
                show_points: false
          - type: custom:mini-graph-card
            name: Carlos
            icon: mdi:bed
            hours_to_show: 168
            points_per_hour: 4
            line_width: 2
            height: 110
            lower_bound: 0
            decimals: 0
            color_thresholds_transition: smooth
            show:
              extrema: true
              average: true
              state: false
              labels: false
              legend: false
            entities:
              - entity: sensor.smartplug_carlos_1min
                name: Carlos
                color: "#81c784"
                aggregate_func: avg
                show_points: false
          - type: custom:mini-graph-card
            name: Lauren
            icon: mdi:bed
            hours_to_show: 168
            points_per_hour: 4
            line_width: 2
            height: 110
            lower_bound: 0
            decimals: 0
            color_thresholds_transition: smooth
            show:
              extrema: true
              average: true
              state: false
              labels: false
              legend: false
            entities:
              - entity: sensor.smartplug_lauren_1min
                name: Lauren
                color: "#ce93d8"
                aggregate_func: avg
                show_points: false

      - type: entities
        title: Appearance
        show_header_toggle: false
        entities:
          - entity: input_boolean.dark_mode
            name: Dark mode

  - title: Network
    id: network
    icon: mdi:router-network
    cards:
      - type: entities
        title: Connectivity
        show_header_toggle: false
        entities:
          - name: WAN Status
            entity: binary_sensor.unifi_dream_machine_wan_status
          - name: Uptime
            entity: sensor.udm_uptime_formatted
          - entity: person.brian

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mini-graph-card
            name: DMP KiB/s
            icon: mdi:router-wireless
            hours_to_show: 24
            points_per_hour: 3
            line_width: 2
            height: 120
            show:
              state: true
              labels: hover
              points: hover
            entities:
              - entity: sensor.unifi_dream_machine_download_speed
                name: KiB/s received
                color: "#64b5f6"
                show_points: false
              - entity: sensor.unifi_dream_machine_upload_speed
                name: KiB/s sent
                color: "#ffb74d"
                show_points: false
          - type: custom:mini-graph-card
            name: DMP Packets/s
            icon: mdi:router-wireless
            hours_to_show: 24
            points_per_hour: 3
            line_width: 2
            height: 120
            show:
              state: true
              labels: hover
              points: hover
            entities:
              - entity: sensor.unifi_dream_machine_packets_received
                name: Packets/s received
                color: "#64b5f6"
                show_points: false
              - entity: sensor.unifi_dream_machine_packets_sent
                name: Packets/s sent
                color: "#ffb74d"
                show_points: false
