# Pre-commit hooks for hass-config (Home Assistant configuration, a git-tracked config directory).
# Install once per clone:  pre-commit install
# Run on everything:       pre-commit run --all-files
# https://pre-commit.com
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-yaml
        # Home Assistant YAML uses custom tags (!include, !secret, !input, ...) that a plain YAML
        # loader rejects. --unsafe only checks syntax, it does not construct those objects.
        args: [--unsafe, --allow-multiple-documents]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]

  # Secret scanning. Credentials live in secrets.yaml (ignored); nothing else should hold tokens.
  # https://github.com/sirwart/ripsecrets
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets

  - repo: local
    hooks:
      # Files that .gitignore keeps out on purpose; this only fires if one is force-added.
      - id: forbid-local-only-files
        name: forbid local-only files (secrets, HA runtime state)
        language: fail
        entry: >-
          This path is local-only (see .gitignore): secrets or Home Assistant runtime state.
        files: >-
          (^secrets\.yaml$|^\.storage/|^\.cloud/|^\.HA_VERSION$|^\.envrc$|^home-assistant\..*|^\.ha_run\.lock$)
