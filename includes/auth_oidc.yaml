# Keycloak (OIDC) sign-in for Home Assistant, via the hass-oidc-auth custom integration.
# https://github.com/christiaangoossens/hass-oidc-auth
# https://github.com/christiaangoossens/hass-oidc-auth/blob/main/docs/provider-configurations/keycloak.md
# https://github.com/christiaangoossens/hass-oidc-auth/blob/main/docs/configuration.md
#
# Needs: the integration installed through HACS (it lives in custom_components/, which is gitignored),
# the `home-assistant` client + `groups` scope in Keycloak (realm `inferno`), and a restart.
# Nothing here is secret: a public client with PKCE has no client secret.
#
# Access is by Keycloak group (group names, full path off in the mapper):
#   messiah -> Home Assistant administrator
#   diwis   -> Home Assistant regular user (no Settings access)
# Anyone in neither group is rejected at login.
#
# Not enabled on purpose: features.automatic_user_linking (it ignores MFA when a username matches a
# local user). The local "Brian" owner account keeps its password login as a break-glass path; OIDC
# users are created as separate Home Assistant users on first sign-in. Permissions are only set on
# the FIRST login, so changing someone's Keycloak group later does not change their HA role.
client_id: home-assistant
discovery_url: https://keycloak.powell.place/realms/inferno/.well-known/openid-configuration

claims:
  display_name: name
  username: preferred_username
  groups: groups
groups_scope: groups
roles:
  admin: messiah
  user: diwis

features:
  # The `groups` claim comes from a mapper on the home-assistant client itself, not from a `groups`
  # client scope, so asking Keycloak for that scope fails with invalid_scope ("Missing code or state
  # parameter" on the callback page). The claim is still in the token.
  include_groups_scope: false
  # TLS ends at Traefik, so HA sees plain HTTP; without this the callback URL can come out as http://.
  force_https: true
  # Skip HA's own login page and go straight to Keycloak (desktop browsers; the mobile app still uses
  # its device-code flow). The local break-glass login is then at
  # https://hass.powell.place/?skip_oidc_redirect=true
  default_redirect: true
