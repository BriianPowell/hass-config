# Sensors

# Integrate normalized KiB/s templates into cumulative KiB (restored across HA restarts).
# Sources: sensor.dmp_wan_download_kib_s / sensor.dmp_wan_upload_kib_s
- platform: integration
  source: sensor.dmp_wan_download_kib_s
  name: DMP WAN Download Total
  unique_id: dmp_wan_download_total
  unit_time: s
  method: trapezoidal
  max_sub_interval:
    minutes: 5
  round: 2

- platform: integration
  source: sensor.dmp_wan_upload_kib_s
  name: DMP WAN Upload Total
  unique_id: dmp_wan_upload_total
  unit_time: s
  method: trapezoidal
  max_sub_interval:
    minutes: 5
  round: 2

# Packet rates from the cumulative counters in includes/templates/21_dmp_connectivity.yaml.
- platform: derivative
  source: sensor.dmp_wan_packets_received
  name: DMP WAN Packets Received Rate
  unique_id: dmp_wan_packets_received_rate
  unit_time: s
  unit: packets/s
  time_window: "00:01:00"
  round: 0

- platform: derivative
  source: sensor.dmp_wan_packets_sent
  name: DMP WAN Packets Sent Rate
  unique_id: dmp_wan_packets_sent_rate
  unit_time: s
  unit: packets/s
  time_window: "00:01:00"
  round: 0

# UniFi does not expose WAN IP; poll public address (same as WAN for most homes).
- platform: rest
  name: DMP WAN Public IP (ipify)
  unique_id: dmp_wan_public_ip_ipify
  resource: https://api.ipify.org?format=json
  value_template: "{{ value_json.ip }}"
  scan_interval: 600
  timeout: 10

- platform: statistics
  name: Server SmartPlug Power 30min
  unique_id: server_smartplug_power_30min
  entity_id: sensor.smartplug_server_1min
  state_characteristic: mean
  precision: 0
  sampling_size: 30
  max_age:
    minutes: 30

- platform: statistics
  name: PC SmartPlug Power 30min
  unique_id: pc_smartplug_power_30min
  entity_id: sensor.smartplug_pc_1min
  state_characteristic: mean
  precision: 0
  sampling_size: 30
  max_age:
    minutes: 30

- platform: statistics
  name: Lauren SmartPlug Power 30min
  unique_id: lauren_smartplug_power_30min
  entity_id: sensor.smartplug_lauren_1min
  state_characteristic: mean
  precision: 0
  sampling_size: 30
  max_age:
    minutes: 30

- platform: statistics
  name: Carlos SmartPlug Power 30min
  unique_id: carlos_smartplug_power_30min
  entity_id: sensor.smartplug_carlos_1min
  state_characteristic: mean
  precision: 0
  sampling_size: 30
  max_age:
    minutes: 30
