# Sensors

# Integrate normalized KiB/s templates into cumulative KiB (resets on HA restart).
# Sources: sensor.dmp_wan_download_kib_s / sensor.dmp_wan_upload_kib_s
- platform: integration
  source: sensor.dmp_wan_download_kib_s
  name: DMP WAN Download Total
  unique_id: dmp_wan_download_total
  unit_time: s
  method: trapezoidal
  max_sub_interval:
    minutes: 5
  round: 2

- platform: integration
  source: sensor.dmp_wan_upload_kib_s
  name: DMP WAN Upload Total
  unique_id: dmp_wan_upload_total
  unit_time: s
  method: trapezoidal
  max_sub_interval:
    minutes: 5
  round: 2

# UniFi does not expose WAN IP; poll public address (same as WAN for most homes).
- platform: rest
  name: DMP WAN Public IP (ipify)
  unique_id: dmp_wan_public_ip_ipify
  resource: https://api.ipify.org?format=json
  value_template: "{{ value_json.ip }}"
  scan_interval: 600
  timeout: 10

- platform: statistics
  name: Server SmartPlug Power 30min
  entity_id: sensor.smartplug_server_1min
  state_characteristic: mean
  precision: 0
  sampling_size: 30
  max_age:
    minutes: 30

