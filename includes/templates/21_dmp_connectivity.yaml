# WAN connectivity from the UPnP integration (binary_sensor.unifi_dream_machine_wan_status).

- binary_sensor:
  - default_entity_id: binary_sensor.dmp_wan_online
    unique_id: dmp_wan_online
    name: DMP WAN Online
    device_class: connectivity
    icon: mdi:wan
    availability: "{{ has_value('binary_sensor.unifi_dream_machine_wan_status') }}"
    state: "{{ is_state('binary_sensor.unifi_dream_machine_wan_status', 'on') }}"
