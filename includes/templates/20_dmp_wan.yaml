# DMP WAN template sensors (merged via includes/templates/).
# Normalizes UniFi rate units to KiB/s, then Mbit/s for display / monthly averages.

- sensor:
  - default_entity_id: sensor.dmp_wan_download_kib_s
    name: DMP WAN Download Rate
    unit_of_measurement: KiB/s
    device_class: data_rate
    state_class: measurement
    icon: mdi:download
    availability: >-
      {{ states('sensor.boog_dmp_download_speed') not in ['unknown', 'unavailable'] or
         states('sensor.unifi_dream_machine_download_speed') not in ['unknown', 'unavailable'] }}
    state: >-
      {% set candidates = [
        'sensor.boog_dmp_download_speed',
        'sensor.boog_dmp_download_speed_2',
        'sensor.unifi_dream_machine_download_speed'
      ] %}
      {% set ns = namespace(v=none, uom='') %}
      {% for e in candidates %}
        {% if ns.v is none and states(e) not in ['unknown', 'unavailable', ''] %}
          {% set ns.v = states(e) | float(0) %}
          {% set ns.uom = state_attr(e, 'unit_of_measurement') | default('') %}
        {% endif %}
      {% endfor %}
      {% if ns.v is none %}
        0
      {% elif ns.uom in ['Mbit/s', 'Mb/s', 'Mbps'] %}
        {{ (ns.v * 1000000 / 8 / 1024) | round(4) }}
      {% elif ns.uom in ['MB/s'] %}
        {{ (ns.v * 1000000 / 1024) | round(4) }}
      {% elif ns.uom in ['MiB/s'] %}
        {{ (ns.v * 1024) | round(4) }}
      {% elif ns.uom in ['kB/s', 'KB/s'] %}
        {{ (ns.v * 1000 / 1024) | round(4) }}
      {% else %}
        {{ ns.v | round(4) }}
      {% endif %}
    attributes:
      source_entity: >-
        {% set candidates = [
          'sensor.boog_dmp_download_speed',
          'sensor.boog_dmp_download_speed_2',
          'sensor.unifi_dream_machine_download_speed'
        ] %}
        {% set ns = namespace(e='') %}
        {% for c in candidates %}
          {% if ns.e == '' and states(c) not in ['unknown', 'unavailable', ''] %}
            {% set ns.e = c %}
          {% endif %}
        {% endfor %}
        {{ ns.e if ns.e != '' else 'none' }}
      source_unit: >-
        {% set e = state_attr('sensor.dmp_wan_download_kib_s', 'source_entity') %}
        {{ state_attr(e, 'unit_of_measurement') if e and e != 'none' else '' }}

  - default_entity_id: sensor.dmp_wan_upload_kib_s
    name: DMP WAN Upload Rate
    unit_of_measurement: KiB/s
    device_class: data_rate
    state_class: measurement
    icon: mdi:upload
    availability: >-
      {{ states('sensor.boog_dmp_upload_speed') not in ['unknown', 'unavailable'] or
         states('sensor.unifi_dream_machine_upload_speed') not in ['unknown', 'unavailable'] }}
    state: >-
      {% set candidates = [
        'sensor.boog_dmp_upload_speed',
        'sensor.boog_dmp_upload_speed_2',
        'sensor.unifi_dream_machine_upload_speed'
      ] %}
      {% set ns = namespace(v=none, uom='') %}
      {% for e in candidates %}
        {% if ns.v is none and states(e) not in ['unknown', 'unavailable', ''] %}
          {% set ns.v = states(e) | float(0) %}
          {% set ns.uom = state_attr(e, 'unit_of_measurement') | default('') %}
        {% endif %}
      {% endfor %}
      {% if ns.v is none %}
        0
      {% elif ns.uom in ['Mbit/s', 'Mb/s', 'Mbps'] %}
        {{ (ns.v * 1000000 / 8 / 1024) | round(4) }}
      {% elif ns.uom in ['MB/s'] %}
        {{ (ns.v * 1000000 / 1024) | round(4) }}
      {% elif ns.uom in ['MiB/s'] %}
        {{ (ns.v * 1024) | round(4) }}
      {% elif ns.uom in ['kB/s', 'KB/s'] %}
        {{ (ns.v * 1000 / 1024) | round(4) }}
      {% else %}
        {{ ns.v | round(4) }}
      {% endif %}
    attributes:
      source_entity: >-
        {% set candidates = [
          'sensor.boog_dmp_upload_speed',
          'sensor.boog_dmp_upload_speed_2',
          'sensor.unifi_dream_machine_upload_speed'
        ] %}
        {% set ns = namespace(e='') %}
        {% for c in candidates %}
          {% if ns.e == '' and states(c) not in ['unknown', 'unavailable', ''] %}
            {% set ns.e = c %}
          {% endif %}
        {% endfor %}
        {{ ns.e if ns.e != '' else 'none' }}

  - default_entity_id: sensor.dmp_wan_download_mbps
    name: DMP WAN Download
    unit_of_measurement: Mbit/s
    device_class: data_rate
    state_class: measurement
    icon: mdi:download
    state: >-
      {{ (states('sensor.dmp_wan_download_kib_s') | float(0) * 1024 * 8 / 1e6) | round(2) }}

  - default_entity_id: sensor.dmp_wan_upload_mbps
    name: DMP WAN Upload
    unit_of_measurement: Mbit/s
    device_class: data_rate
    state_class: measurement
    icon: mdi:upload
    state: >-
      {{ (states('sensor.dmp_wan_upload_kib_s') | float(0) * 1024 * 8 / 1e6) | round(2) }}

  - default_entity_id: sensor.dmp_wan_monthly_download_mbps
    name: DMP WAN Monthly Avg Download
    unit_of_measurement: Mbit/s
    device_class: data_rate
    state_class: measurement
    icon: mdi:download
    state: >-
      {% set kib = states('sensor.dmp_wan_download_monthly') | float(0) %}
      {% set reset = state_attr('sensor.dmp_wan_download_monthly', 'last_reset') %}
      {% set start = as_timestamp(reset) if reset else as_timestamp(now().replace(day=1, hour=0, minute=0, second=0, microsecond=0)) %}
      {% set sec = (now().timestamp() - start) | float(1) %}
      {{ ((kib * 1024 * 8) / sec / 1e6) | round(2) if sec > 60 else 0 }}
    attributes:
      total_gib: >-
        {% set kib = states('sensor.dmp_wan_download_monthly') | float(0) %}
        {{ (kib / 1048576) | round(2) }}
      last_reset: >-
        {{ state_attr('sensor.dmp_wan_download_monthly', 'last_reset')
           or now().replace(day=1, hour=0, minute=0, second=0, microsecond=0) }}

  - default_entity_id: sensor.dmp_wan_monthly_upload_mbps
    name: DMP WAN Monthly Avg Upload
    unit_of_measurement: Mbit/s
    device_class: data_rate
    state_class: measurement
    icon: mdi:upload
    state: >-
      {% set kib = states('sensor.dmp_wan_upload_monthly') | float(0) %}
      {% set reset = state_attr('sensor.dmp_wan_upload_monthly', 'last_reset') %}
      {% set start = as_timestamp(reset) if reset else as_timestamp(now().replace(day=1, hour=0, minute=0, second=0, microsecond=0)) %}
      {% set sec = (now().timestamp() - start) | float(1) %}
      {{ ((kib * 1024 * 8) / sec / 1e6) | round(2) if sec > 60 else 0 }}
    attributes:
      total_gib: >-
        {% set kib = states('sensor.dmp_wan_upload_monthly') | float(0) %}
        {{ (kib / 1048576) | round(2) }}
      last_reset: >-
        {{ state_attr('sensor.dmp_wan_upload_monthly', 'last_reset')
           or now().replace(day=1, hour=0, minute=0, second=0, microsecond=0) }}

  - default_entity_id: sensor.dmp_wan_monthly_total_mbps
    name: DMP WAN Monthly Avg Total
    unit_of_measurement: Mbit/s
    device_class: data_rate
    state_class: measurement
    icon: mdi:wan
    state: >-
      {% set down = states('sensor.dmp_wan_download_monthly') | float(0) %}
      {% set up = states('sensor.dmp_wan_upload_monthly') | float(0) %}
      {% set reset = state_attr('sensor.dmp_wan_download_monthly', 'last_reset') %}
      {% set start = as_timestamp(reset) if reset else as_timestamp(now().replace(day=1, hour=0, minute=0, second=0, microsecond=0)) %}
      {% set sec = (now().timestamp() - start) | float(1) %}
      {{ (((down + up) * 1024 * 8) / sec / 1e6) | round(2) if sec > 60 else 0 }}
    attributes:
      download_mbps: "{{ states('sensor.dmp_wan_monthly_download_mbps') }}"
      upload_mbps: "{{ states('sensor.dmp_wan_monthly_upload_mbps') }}"
      total_gib: >-
        {% set down = states('sensor.dmp_wan_download_monthly') | float(0) %}
        {% set up = states('sensor.dmp_wan_upload_monthly') | float(0) %}
        {{ ((down + up) / 1048576) | round(2) }}
      last_reset: >-
        {{ state_attr('sensor.dmp_wan_download_monthly', 'last_reset')
           or now().replace(day=1, hour=0, minute=0, second=0, microsecond=0) }}

  - default_entity_id: sensor.dmp_wan_latency_ms
    name: DMP WAN Latency
    unit_of_measurement: ms
    state_class: measurement
    icon: mdi:speedometer
    state: >-
      {% set candidates = [
        'sensor.boog_dmp_google_wan_latency',
        'sensor.boog_dmp_cloudflare_wan_latency',
        'sensor.boog_dmp_microsoft_wan_latency',
        'sensor.boog_dmp_google_wan_latency_2',
        'sensor.boog_dmp_cloudflare_wan_latency_2',
        'sensor.boog_dmp_microsoft_wan_latency_2',
        'sensor.unifi_dream_machine_google_wan_latency',
        'sensor.unifi_dream_machine_cloudflare_wan_latency',
        'sensor.unifi_dream_machine_microsoft_wan_latency',
      ] %}
      {% set ns = namespace(v=none) %}
      {% for e in candidates %}
        {% if ns.v is none and states(e) not in ['unknown', 'unavailable', 'none', ''] %}
          {% set ns.v = states(e) | float(0) %}
        {% endif %}
      {% endfor %}
      {{ ns.v if ns.v is not none else 'unknown' }}
    attributes:
      source_entity: >-
        {% set candidates = [
          'sensor.boog_dmp_google_wan_latency',
          'sensor.boog_dmp_cloudflare_wan_latency',
          'sensor.boog_dmp_microsoft_wan_latency',
          'sensor.boog_dmp_google_wan_latency_2',
          'sensor.boog_dmp_cloudflare_wan_latency_2',
          'sensor.boog_dmp_microsoft_wan_latency_2',
          'sensor.unifi_dream_machine_google_wan_latency',
          'sensor.unifi_dream_machine_cloudflare_wan_latency',
          'sensor.unifi_dream_machine_microsoft_wan_latency',
        ] %}
        {% set ns = namespace(e='') %}
        {% for c in candidates %}
          {% if ns.e == '' and states(c) not in ['unknown', 'unavailable', 'none', ''] %}
            {% set ns.e = c %}
          {% endif %}
        {% endfor %}
        {{ ns.e if ns.e != '' else 'none' }}

  - default_entity_id: sensor.dmp_wan_public_ip
    name: DMP WAN IP
    icon: mdi:ip-network
    state: >-
      {% set candidates = [
        'sensor.boog_dmp_wan_ip',
        'sensor.unifi_dream_machine_wan_ip',
        'sensor.dmp_wan_public_ip_ipify'
      ] %}
      {% set ns = namespace(ip='') %}
      {% for e in candidates %}
        {% if ns.ip == '' and states(e) not in ['unknown', 'unavailable', 'none', ''] %}
          {% set ns.ip = states(e) %}
        {% endif %}
      {% endfor %}
      {{ ns.ip if ns.ip != '' else 'unknown' }}
