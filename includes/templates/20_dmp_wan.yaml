# DMP WAN template sensors (merged via includes/templates/).
# WAN throughput, packets and external IP come from the UPnP integration (sensor.unifi_dream_machine_*);
# latency comes from the UniFi integration (sensor.boog_dmp_*). The UniFi Protect integration also
# creates boog_dmp_* entities with a _2 suffix (CPU, memory, uptime); those are not used here.
# Normalizes the UPnP rate unit to KiB/s, then Mbit/s for display / monthly averages.

- sensor:
  - default_entity_id: sensor.dmp_wan_download_kib_s
    unique_id: dmp_wan_download_kib_s
    name: DMP WAN Download Rate
    unit_of_measurement: KiB/s
    device_class: data_rate
    state_class: measurement
    icon: mdi:download
    availability: "{{ has_value('sensor.unifi_dream_machine_download_speed') }}"
    state: >-
      {% set e = 'sensor.unifi_dream_machine_download_speed' %}
      {% set v = states(e) | float(0) %}
      {% set uom = state_attr(e, 'unit_of_measurement') | default('') %}
      {% if uom in ['Mbit/s', 'Mb/s', 'Mbps'] %}
        {{ (v * 1000000 / 8 / 1024) | round(4) }}
      {% elif uom in ['MB/s'] %}
        {{ (v * 1000000 / 1024) | round(4) }}
      {% elif uom in ['MiB/s'] %}
        {{ (v * 1024) | round(4) }}
      {% elif uom in ['kB/s', 'KB/s'] %}
        {{ (v * 1000 / 1024) | round(4) }}
      {% else %}
        {{ v | round(4) }}
      {% endif %}

  - default_entity_id: sensor.dmp_wan_upload_kib_s
    unique_id: dmp_wan_upload_kib_s
    name: DMP WAN Upload Rate
    unit_of_measurement: KiB/s
    device_class: data_rate
    state_class: measurement
    icon: mdi:upload
    availability: "{{ has_value('sensor.unifi_dream_machine_upload_speed') }}"
    state: >-
      {% set e = 'sensor.unifi_dream_machine_upload_speed' %}
      {% set v = states(e) | float(0) %}
      {% set uom = state_attr(e, 'unit_of_measurement') | default('') %}
      {% if uom in ['Mbit/s', 'Mb/s', 'Mbps'] %}
        {{ (v * 1000000 / 8 / 1024) | round(4) }}
      {% elif uom in ['MB/s'] %}
        {{ (v * 1000000 / 1024) | round(4) }}
      {% elif uom in ['MiB/s'] %}
        {{ (v * 1024) | round(4) }}
      {% elif uom in ['kB/s', 'KB/s'] %}
        {{ (v * 1000 / 1024) | round(4) }}
      {% else %}
        {{ v | round(4) }}
      {% endif %}

  - default_entity_id: sensor.dmp_wan_download_mbps
    unique_id: dmp_wan_download_mbps
    name: DMP WAN Download
    unit_of_measurement: Mbit/s
    device_class: data_rate
    state_class: measurement
    icon: mdi:download
    state: >-
      {{ (states('sensor.dmp_wan_download_kib_s') | float(0) * 1024 * 8 / 1e6) | round(2) }}

  - default_entity_id: sensor.dmp_wan_upload_mbps
    unique_id: dmp_wan_upload_mbps
    name: DMP WAN Upload
    unit_of_measurement: Mbit/s
    device_class: data_rate
    state_class: measurement
    icon: mdi:upload
    state: >-
      {{ (states('sensor.dmp_wan_upload_kib_s') | float(0) * 1024 * 8 / 1e6) | round(2) }}

  - default_entity_id: sensor.dmp_wan_monthly_download_mbps
    unique_id: dmp_wan_monthly_download_mbps
    name: DMP WAN Monthly Avg Download
    unit_of_measurement: Mbit/s
    device_class: data_rate
    state_class: measurement
    icon: mdi:download
    state: >-
      {% set kib = states('sensor.dmp_wan_download_monthly') | float(0) %}
      {% set reset = state_attr('sensor.dmp_wan_download_monthly', 'last_reset') %}
      {% set start = as_timestamp(reset) if reset else as_timestamp(now().replace(day=1, hour=0, minute=0, second=0, microsecond=0)) %}
      {% set sec = (now().timestamp() - start) | float(1) %}
      {{ ((kib * 1024 * 8) / sec / 1e6) | round(2) if sec > 60 else 0 }}
    attributes:
      total_gib: >-
        {% set kib = states('sensor.dmp_wan_download_monthly') | float(0) %}
        {{ (kib / 1048576) | round(2) }}
      last_reset: >-
        {{ state_attr('sensor.dmp_wan_download_monthly', 'last_reset')
           or now().replace(day=1, hour=0, minute=0, second=0, microsecond=0) }}

  - default_entity_id: sensor.dmp_wan_monthly_upload_mbps
    unique_id: dmp_wan_monthly_upload_mbps
    name: DMP WAN Monthly Avg Upload
    unit_of_measurement: Mbit/s
    device_class: data_rate
    state_class: measurement
    icon: mdi:upload
    state: >-
      {% set kib = states('sensor.dmp_wan_upload_monthly') | float(0) %}
      {% set reset = state_attr('sensor.dmp_wan_upload_monthly', 'last_reset') %}
      {% set start = as_timestamp(reset) if reset else as_timestamp(now().replace(day=1, hour=0, minute=0, second=0, microsecond=0)) %}
      {% set sec = (now().timestamp() - start) | float(1) %}
      {{ ((kib * 1024 * 8) / sec / 1e6) | round(2) if sec > 60 else 0 }}
    attributes:
      total_gib: >-
        {% set kib = states('sensor.dmp_wan_upload_monthly') | float(0) %}
        {{ (kib / 1048576) | round(2) }}
      last_reset: >-
        {{ state_attr('sensor.dmp_wan_upload_monthly', 'last_reset')
           or now().replace(day=1, hour=0, minute=0, second=0, microsecond=0) }}

  - default_entity_id: sensor.dmp_wan_monthly_total_mbps
    unique_id: dmp_wan_monthly_total_mbps
    name: DMP WAN Monthly Avg Total
    unit_of_measurement: Mbit/s
    device_class: data_rate
    state_class: measurement
    icon: mdi:wan
    state: >-
      {% set down = states('sensor.dmp_wan_download_monthly') | float(0) %}
      {% set up = states('sensor.dmp_wan_upload_monthly') | float(0) %}
      {% set reset = state_attr('sensor.dmp_wan_download_monthly', 'last_reset') %}
      {% set start = as_timestamp(reset) if reset else as_timestamp(now().replace(day=1, hour=0, minute=0, second=0, microsecond=0)) %}
      {% set sec = (now().timestamp() - start) | float(1) %}
      {{ (((down + up) * 1024 * 8) / sec / 1e6) | round(2) if sec > 60 else 0 }}
    attributes:
      download_mbps: "{{ states('sensor.dmp_wan_monthly_download_mbps') }}"
      upload_mbps: "{{ states('sensor.dmp_wan_monthly_upload_mbps') }}"
      total_gib: >-
        {% set down = states('sensor.dmp_wan_download_monthly') | float(0) %}
        {% set up = states('sensor.dmp_wan_upload_monthly') | float(0) %}
        {{ ((down + up) / 1048576) | round(2) }}
      last_reset: >-
        {{ state_attr('sensor.dmp_wan_download_monthly', 'last_reset')
           or now().replace(day=1, hour=0, minute=0, second=0, microsecond=0) }}

  # Fastest of the three probes (Google, Cloudflare, Microsoft) that currently have a value.
  - default_entity_id: sensor.dmp_wan_latency_ms
    unique_id: dmp_wan_latency_ms
    name: DMP WAN Latency
    unit_of_measurement: ms
    state_class: measurement
    icon: mdi:speedometer
    availability: >-
      {{ ['sensor.boog_dmp_google_wan_latency', 'sensor.boog_dmp_cloudflare_wan_latency',
          'sensor.boog_dmp_microsoft_wan_latency'] | select('has_value') | list | count > 0 }}
    state: >-
      {% set vals = ['sensor.boog_dmp_google_wan_latency', 'sensor.boog_dmp_cloudflare_wan_latency',
                     'sensor.boog_dmp_microsoft_wan_latency']
                    | select('has_value') | map('states') | map('float', 0) | list %}
      {{ (vals | min) if vals else 0 }}

  - default_entity_id: sensor.dmp_wan_public_ip
    unique_id: dmp_wan_public_ip
    name: DMP WAN IP
    icon: mdi:ip-network
    state: >-
      {% set e = ['sensor.unifi_dream_machine_external_ip', 'sensor.dmp_wan_public_ip_ipify']
                 | select('has_value') | first | default('') %}
      {{ states(e) if e else 'unknown' }}
