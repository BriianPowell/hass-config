- sensor:
  - default_entity_id: sensor.udm_uptime_formatted
    unique_id: udm_uptime_formatted
    name: UniFi Dream Machine Uptime Formatted
    # The UniFi integration reports uptime as a boot timestamp; older versions used seconds.
    availability: >-
      {{ ['sensor.boog_dmp_uptime', 'sensor.unifi_dream_machine_uptime']
         | select('has_value') | list | count > 0 }}
    state: >-
      {% set e = ['sensor.boog_dmp_uptime', 'sensor.unifi_dream_machine_uptime']
         | select('has_value') | first %}
      {% set raw = states(e) %}
      {% if raw | is_number %}
        {% set time = raw | int %}
      {% else %}
        {% set time = (now().timestamp() - as_timestamp(raw, now().timestamp())) | int %}
      {% endif %}
      {% set minutes = ((time % 3600) / 60) | int %}
      {% set hours = ((time % 86400) / 3600) | int %}
      {% set days = (time / 86400) | int %}
      {%- if time < 60 -%}
        Less than a minute
      {%- else -%}
        {%- if days > 0 -%}{{ days }}d{%- endif -%}
        {%- if hours > 0 -%}{% if days > 0 %} {% endif %}{{ hours }}h{%- endif -%}
        {%- if minutes > 0 -%}{% if days > 0 or hours > 0 %} {% endif %}{{ minutes }}m{%- endif -%}
      {%- endif -%}
